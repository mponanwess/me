name: me

services:
  nginx:
    image: nginx:1.30.5-alpine
    container_name: me-nginx
    ports:
      - "80:80"
    volumes:
      - ./site/dist:/usr/share/nginx/html:ro
  npm:
    image: node:24.20.0-slim
    working_dir: /usr/src/app
    entrypoint: ["npm"]
    env_file:
      - path: .env
        required: false
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./site:/usr/src/app
