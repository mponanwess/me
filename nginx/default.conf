server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    charset utf-8;

    server_tokens off;

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /assets/ {
        expires 1y;
        access_log off;
    }
}
