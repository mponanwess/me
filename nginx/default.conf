# ── HTTP : sert le défi ACME, redirige le reste ──
server {
    listen 80;
    listen [::]:80;
    server_name me.mponanwess.com;

    # Doit rester en clair : c'est par là que passent les renouvellements.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name me.mponanwess.com;

    ssl_certificate     /etc/letsencrypt/live/me.mponanwess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/me.mponanwess.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Posés une seule fois : tout location sans add_header en hérite.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=300" always;

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /assets/ {
        expires 1y;
        access_log off;
    }
}
